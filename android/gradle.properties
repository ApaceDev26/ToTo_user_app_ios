# Cap heap for ~16GB machines: -Xmx4096m often gets the daemon OOM-killed when
# free RAM is low (Gradle + Kotlin daemon + Flutter + IDE compete).
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Fewer concurrent Gradle workers reduces races on Windows when project (I:) and
# caches (e.g. K:) are on different drives.
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
# android.enableR8 is deprecated and removed in AGP 7.0+
# Disable Kotlin incremental compilation to avoid cross-drive path issues
kotlin.incremental=false
# Flutter uses a composite Gradle build under flutter.sdk (often on another drive).
# File watchers + incremental state on Windows multi-drive setups can break :gradle:pluginDescriptors.
org.gradle.vfs.watch=false
# Prefer a fresh daemon after JVM arg changes / crash recovery.
org.gradle.daemon.idletimeout=600000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

