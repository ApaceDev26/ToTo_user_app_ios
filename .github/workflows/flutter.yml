name: Build & Upload ToTo Food iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode and iOS SDK version
        run: |
          xcodebuild -version
          echo "iOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          architecture: arm64
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get Flutter packages
        run: flutter pub get

      # ============================================================
      # Install Apple Distribution Certificate
      # ============================================================
      - name: Install Apple Distribution Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "Installed signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # ============================================================
      # Install Provisioning Profile
      # ============================================================
      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          PROFILE_PLIST=$RUNNER_TEMP/profile.plist

          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")

          echo "Provisioning Profile Name: $PROFILE_NAME"
          echo "Provisioning Profile UUID: $PROFILE_UUID"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      # ============================================================
      # Inspect Profile
      # ============================================================
      - name: Inspect Provisioning Profile
        run: |
          PROFILE_PLIST=$RUNNER_TEMP/profile.plist

          echo "================ PROFILE INFO ================"
          /usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST" || true
          /usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST" || true
          /usr/libexec/PlistBuddy -c "Print TeamIdentifier" "$PROFILE_PLIST" || true

          echo "================ PROFILE ENTITLEMENTS ================"
          /usr/libexec/PlistBuddy -c "Print Entitlements" "$PROFILE_PLIST" || true

      # ============================================================
      # Check Project Signing Settings
      # ============================================================
      - name: Show Signing Configuration
        run: |
          echo "================ XCODE SIGNING SETTINGS ================"

          grep -n \
            "DEVELOPMENT_TEAM\|CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY\|PROVISIONING_PROFILE_SPECIFIER\|CODE_SIGN_ENTITLEMENTS\|PRODUCT_BUNDLE_IDENTIFIER" \
            ios/Runner.xcodeproj/project.pbxproj || true

          echo "================ RUNNER ENTITLEMENTS ================"
          cat ios/Runner/Runner.entitlements || true

      # ============================================================
      # CocoaPods
      # ============================================================
      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # ============================================================
      # Create ExportOptions.plist
      # ============================================================
      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>method</key>
              <string>app-store-connect</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>SLSGP9WL73</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>com.toto.food.user</key>
                  <string>ToTo AppStore Profile</string>
              </dict>

              <key>stripSwiftSymbols</key>
              <true/>

              <key>uploadSymbols</key>
              <true/>

          </dict>
          </plist>
          EOF

          cat ios/ExportOptions.plist

      # ============================================================
      # Build IPA
      # ============================================================
      - name: Build ToTo Food IPA
        shell: bash
        run: |
          set -o pipefail

          flutter build ipa -v \
            --release \
            --build-name=1.0.2 \
            --build-number=7 \
            --export-options-plist=ios/ExportOptions.plist \
            2>&1 | tee flutter_build.log

      # ============================================================
      # Show Errors if Build Fails
      # ============================================================
      - name: Show Important Build Errors
        if: failure()
        shell: bash
        run: |
          echo "================================================"
          echo "IMPORTANT BUILD ERRORS"
          echo "================================================"

          grep -nEi \
            "error:|fatal error|failed|failure|provisioning|entitlement|codesign|code sign|PhaseScriptExecution|requires a provisioning profile|doesn't include|does not include|no profiles|Command .* failed" \
            flutter_build.log \
            | tail -300 || true

          echo ""
          echo "================================================"
          echo "LAST 400 LINES"
          echo "================================================"

          tail -400 flutter_build.log || true

      # ============================================================
      # Upload Diagnostic Log
      # ============================================================
      - name: Upload Build Diagnostic Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToTo-Food-Build-Log
          path: flutter_build.log
          if-no-files-found: ignore

      # ============================================================
      # Find Generated IPA
      # ============================================================
      - name: Show Generated IPA
        if: success()
        run: |
          echo "Generated IPA files:"
          find build/ios/ipa -type f -name "*.ipa" -print

      # ============================================================
      # Setup App Store Connect API Key
      # ============================================================
      - name: Setup App Store Connect API Key
        if: success()
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"

          echo "$APP_STORE_CONNECT_PRIVATE_KEY" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          chmod 600 \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      # ============================================================
      # Upload to App Store Connect
      # ============================================================
      - name: Upload To App Store Connect
        if: success()
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ios/ipa -type f -name "*.ipa" | head -1)

          echo "Uploading: $IPA_PATH"

          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      # ============================================================
      # Save IPA as GitHub Artifact
      # ============================================================
      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToTo-Food-iOS-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore




